<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Knob – Light Mode for YouTube Music</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="popup">
    <div class="knob">
      <div class="knob__dial" id="knob-dial">
        <div class="knob__surface">
          <div class="dot-rotator" aria-hidden="true">
            <div class="dot"></div>
          </div>
        </div>
      </div>

      <label class="knob__label knob__label--on" for="mode-light">On</label>
      <label class="knob__label knob__label--system" for="mode-system">System</label>
      <label class="knob__label knob__label--off" for="mode-off">Off</label>

      <fieldset class="knob__options">
        <legend class="visually-hidden">Appearance mode</legend>

        <input type="radio" name="mode" id="mode-light" value="light" />
        <input type="radio" name="mode" id="mode-system" value="system" />
        <input type="radio" name="mode" id="mode-off" value="off" />
      </fieldset>

      <p class="knob__caption" aria-hidden="true">Knob – Light Mode for YouTube Music</p>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="popup.js"></script>
</body>

</html>
